spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URL}
      port: 27017
      database: monew
      username: ${SPRING_MONGODB_USERNAME}
      password: ${SPRING_MONGODB_PASSWORD}
      authentication-database: admin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.codeit.monew: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

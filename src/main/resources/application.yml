spring:
  profiles:
    active: dev # dev | prod
  data:
    mongodb:
      uri: mongodb://localhost:27017/monew
      port: 27017
      database: monew

management:
  endpoint:
    health:
      probes:
        enabled: true   # readiness/liveness 사용시
  metrics:
    tags:
      application: app

server:
  port: 8080 # app / 8081 # batch
